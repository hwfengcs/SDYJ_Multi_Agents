[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdyj-multi-agents"
version = "0.6.0a1"
description = "A self-verifying, replayable, benchmarkable LangGraph multi-agent research framework with evidence-grounded reports, cost tracking, and Trace v2 observability."
readme = "README_EN.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "hwfengcs" }
]
keywords = [
  "ai-agent",
  "multi-agent",
  "langgraph",
  "deep-research",
  "llm",
  "mcp",
  "agent-evaluation",
  "agent-tracing",
  "self-verifying-agent",
  "agent-replay",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.50.0",
  "anthropic>=0.39.0",
  "google-genai>=1.0.0",
  "tavily-python>=0.5.0",
  "arxiv>=2.1.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "build>=1.2.0",
]
web = [
  "streamlit>=1.36.0",
]
mcp = [
  "mcp>=1.0.0",
]
benchmarks = [
  "datasets>=2.20.0",
  "huggingface-hub>=0.24.0",
]
all = [
  "streamlit>=1.36.0",
  "mcp>=1.0.0",
  "datasets>=2.20.0",
  "huggingface-hub>=0.24.0",
]

[project.scripts]
sdyj = "SDYJ_Agents.cli.main:main"

[project.urls]
Homepage = "https://github.com/hwfengcs/SDYJ_Multi_Agents"
Repository = "https://github.com/hwfengcs/SDYJ_Multi_Agents"
Issues = "https://github.com/hwfengcs/SDYJ_Multi_Agents/issues"

[tool.setuptools.packages.find]
include = ["SDYJ_Agents*"]

[tool.setuptools.package-data]
SDYJ_Agents = ["prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
