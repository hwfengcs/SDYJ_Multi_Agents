name: sdyj
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10,<3.13
  - pip>=24.0

  # Runtime dependencies available from conda-forge.
  - rich>=13.0.0
  - httpx>=0.27.0
  - requests>=2.32.0
  - pydantic>=2.9.0
  - python-dotenv>=1.0.0
  - jinja2>=3.1.0
  - typing-extensions>=4.12.0

  # Optional features enabled in the default development environment.
  - streamlit>=1.36.0
  - datasets>=2.20.0
  - huggingface_hub>=0.24.0

  # Developer tooling.
  - pytest>=8.0.0
  - pytest-cov>=5.0.0
  - ruff>=0.6.0
  - python-build>=1.2.0
  - twine>=5.0.0

  # Pip is used only for the editable local package and packages that are
  # not consistently available on conda-forge.
  - pip:
      - "-e .[dev,web,mcp,benchmarks]"
